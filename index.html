<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Biały Hetman (Królowa) - Three.js</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #1e1e1e;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0, 6, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x1e1e1e);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.target.set(0, 3, 0);

const whiteMaterial = new THREE.MeshStandardMaterial({
color: 0xf4f4f4,
roughness: 0.2,
metalness: 0.05
});

const group = new THREE.Group();

scene.add(group);

const points = [];

points.push(new THREE.Vector2(0, 0));
points.push(new THREE.Vector2(1.6, 0));
points.push(new THREE.Vector2(1.6, 0.2));
points.push(new THREE.Vector2(1.3, 0.4));
points.push(new THREE.Vector2(1.4, 0.6));

points.push(new THREE.Vector2(0.9, 1.2));
points.push(new THREE.Vector2(0.7, 1.8));
points.push(new THREE.Vector2(0.65, 2.5));
points.push(new THREE.Vector2(0.7, 3.2));

points.push(new THREE.Vector2(1.15, 3.6));
points.push(new THREE.Vector2(1.15, 3.8));
points.push(new THREE.Vector2(0.75, 4.0));
points.push(new THREE.Vector2(1.25, 4.2));
points.push(new THREE.Vector2(1.25, 4.4));
points.push(new THREE.Vector2(0.8, 4.6));

points.push(new THREE.Vector2(0.9, 4.8));
points.push(new THREE.Vector2(1.4, 5.6));
points.push(new THREE.Vector2(1.2, 5.6));

points.push(new THREE.Vector2(0.6, 4.9));
points.push(new THREE.Vector2(0.4, 5.1));
points.push(new THREE.Vector2(0, 5.2));

const queenGeometry = new THREE.LatheGeometry(points, 64);

const queenMesh = new THREE.Mesh(
queenGeometry,
whiteMaterial
);

queenMesh.castShadow = true;
queenMesh.receiveShadow = true;

group.add(queenMesh);

const crownBallsCount = 10;
const radius = 1.3;

for (let i = 0; i < crownBallsCount; i++) {

const angle = (i / crownBallsCount) * Math.PI * 2;

const x = Math.cos(angle) * radius;
const z = Math.sin(angle) * radius;

const ballMesh = new THREE.Mesh(
new THREE.SphereGeometry(0.12, 16, 16),
whiteMaterial
);

ballMesh.position.set(x, 5.65, z);

ballMesh.castShadow = true;

group.add(ballMesh);
}

const topBall = new THREE.Mesh(
new THREE.SphereGeometry(0.28, 32, 32),
whiteMaterial
);

topBall.position.set(0, 5.4, 0);

topBall.castShadow = true;

group.add(topBall);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(40, 40),
new THREE.MeshStandardMaterial({
color: 0x333333,
roughness: 0.8
})
);

floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;

scene.add(floor);

const ambientLight = new THREE.AmbientLight(
0xffffff,
0.5
);

scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(
0xffffff,
1.2
);

dirLight.position.set(6, 10, 8);

dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.bias = -0.0005;

scene.add(dirLight);

const fillLight = new THREE.PointLight(
0xffffff,
0.4
);

fillLight.position.set(-6, 5, -6);

scene.add(fillLight);

function animate() {

requestAnimationFrame(animate);

controls.update();

renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {

camera.aspect = window.innerWidth / window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
});
</script>

</body>
</html>
